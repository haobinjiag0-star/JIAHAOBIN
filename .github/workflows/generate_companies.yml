name: Generate companies.json

on:
  push:
    paths:
      - 'data/**.csv'
      - 'scripts/collect_jobs.py'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install pip
        run: python -m pip install --upgrade pip

      - name: Run collect script
        run: python scripts/collect_jobs.py

      - name: Commit generated file (if changed) and push to branch
        env:
          BRANCH: auto/generate-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/companies.json || true
          # 如果没有变化则退出
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-generate data/companies.json"
          git push --set-upstream origin HEAD:$BRANCH

           - name: Create pull request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Auto-generate data/companies.json
          title: "Auto-generate companies.json"
          body: "This PR updates companies.json generated from CSV by workflow."
          base: main
          branch: auto/generate-data
