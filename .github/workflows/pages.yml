name: Build and deploy JIAHAOBIN

on:
  workflow_dispatch:
  schedule:
    - cron: "17 17 * * *" # 02:17 JST
  push:
    branches: [main]
    paths:
      - "data/companies.csv"
      - "scripts/collect_jobs.py"
      - "index.html"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check listed official recruitment pages
        run: python scripts/collect_jobs.py

      - name: Prepare Pages artifact
        run: |
          rm -rf site
          mkdir -p site/data
          cp index.html site/index.html
          cp data/jobs.json site/data/jobs.json
          find site -maxdepth 3 -type f -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
