name: Build and deploy JIAHAOBIN

on:
  workflow_dispatch:
  schedule:
    - cron: "17 17 * * *" # 02:17 JST
  push:
    branches: [main]
    paths:
      - "data/companies/**"
      - "scripts/collect_jobs.py"
      - "scripts/merge_job_shards.py"
      - "index.html"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check public official recruitment pages
        run: >-
          python scripts/collect_jobs.py
          --shard-index ${{ matrix.shard }}
          --shard-count 8
          --output data/jobs-shard-${{ matrix.shard }}.json

      - name: Upload crawl shard
        uses: actions/upload-artifact@v7
        with:
          name: jobs-shard-${{ matrix.shard }}
          path: data/jobs-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  assemble:
    needs: crawl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download crawl shards
        uses: actions/download-artifact@v8
        with:
          pattern: jobs-shard-*
          path: data/shards
          merge-multiple: true

      - name: Merge and validate all companies
        run: python scripts/merge_job_shards.py data/shards data/jobs.json

      - name: Prepare Pages artifact
        run: |
          rm -rf site
          mkdir -p site/data
          cp index.html site/index.html
          cp data/jobs.json site/data/jobs.json
          find site -maxdepth 3 -type f -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
